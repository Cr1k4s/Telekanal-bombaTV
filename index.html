<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bomba TV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0f;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            width: 100%;
        }

        .vpn-warning {
            text-align: center;
            font-size: 11px;
            color: #ff6b6b;
            background: rgba(255, 0, 0, 0.08);
            padding: 8px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 0, 0, 0.15);
            letter-spacing: 0.3px;
            line-height: 1.6;
        }

        .vpn-warning a {
            color: #ff9900;
            text-decoration: none;
            font-weight: 600;
        }

        .vpn-warning a:hover {
            text-decoration: underline;
        }

        .vpn-warning .highlight {
            color: #ffcc00;
            font-weight: 600;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .logo {
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(135deg, #ff4d4d, #ff9900);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .live-badge {
            background: #ff2a2a;
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: pulse 1.5s infinite;
        }

        .live-badge::before {
            content: "●";
            font-size: 18px;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 42, 42, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(255, 42, 42, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 42, 42, 0); }
        }

        .player-wrapper {
            background: #111118;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
            position: relative;
        }

        .player-wrapper iframe {
            width: 100%;
            display: block;
            aspect-ratio: 16 / 9;
            border: none;
        }

        /* КНОПКА ДИНАМИКА */
        .sound-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            cursor: pointer;
            transition: opacity 0.5s ease;
            z-index: 10;
            border-radius: 20px;
        }

        .sound-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .sound-btn {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 60px;
            padding: 20px 40px;
            color: #fff;
            font-size: 22px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 18px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .sound-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
            border-color: #ff4d4d;
        }

        .sound-btn .icon {
            font-size: 38px;
        }

        .sound-btn .text {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            line-height: 1.3;
        }

        .sound-btn .text small {
            font-size: 14px;
            font-weight: 400;
            opacity: 0.7;
        }

        @media (max-width: 600px) {
            .sound-btn {
                padding: 14px 24px;
                font-size: 18px;
                gap: 12px;
            }
            .sound-btn .icon {
                font-size: 28px;
            }
            .sound-btn .text small {
                font-size: 12px;
            }
        }

        /* ===== ПАНЕЛЬ УПРАВЛЕНИЯ КАЧЕСТВОМ ===== */
        .controls-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .quality-selector {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #1a1a28;
            padding: 6px 16px 6px 20px;
            border-radius: 50px;
            border: 1px solid #2a2a3a;
        }

        .quality-selector label {
            font-size: 13px;
            color: #8a8a9a;
            font-weight: 500;
        }

        .quality-selector select {
            background: #0a0a0f;
            color: #fff;
            border: 1px solid #2a2a3a;
            border-radius: 30px;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            transition: 0.2s;
        }

        .quality-selector select:hover {
            border-color: #ff4d4d;
        }

        .quality-selector select option {
            background: #1a1a28;
            color: #fff;
        }

        .controls-bar .btn-small {
            background: #1e1e2a;
            border: none;
            color: #fff;
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .controls-bar .btn-small:hover {
            background: #2e2e40;
        }
        /* ===== КОНЕЦ ПАНЕЛИ ===== */

        .actions {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .btn {
            background: #1e1e2a;
            border: none;
            color: #fff;
            padding: 12px 28px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .btn:hover {
            background: #2e2e40;
            transform: translateY(-2px);
        }

        .btn-primary {
            background: #ff4d4d;
        }

        .btn-primary:hover {
            background: #ff1a1a;
        }

        .footer {
            margin-top: 30px;
            color: #4a4a5a;
            font-size: 13px;
            text-align: center;
        }

        @media (max-width: 600px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            .controls-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .quality-selector {
                justify-content: center;
            }
            .actions {
                flex-direction: column;
                width: 100%;
            }
            .btn {
                justify-content: center;
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="container">

    <div class="vpn-warning">
        ⚠️ <span class="highlight">ВНИМАНИЕ:</span> Для просмотра телеканала может потребоваться 
        <strong>VPN Happy</strong> или <strong>ZAPRET</strong>. 
        <a href="https://vpn.happy/" target="_blank">Скачать VPN Happy</a> | 
        <a href="https://github.com/bol-van/zapret" target="_blank">ZAPRET</a>
    </div>
    
    <header class="header">
        <div class="logo">📺 Bomba TV</div>
        <div class="live-badge">ПРЯМОЙ ЭФИР</div>
    </header>

    <div class="player-wrapper" id="playerWrapper">
        <!-- YouTube плеер -->
        <iframe 
            id="youtubePlayer"
            src="https://www.youtube.com/embed/Cp7rTJT0nR8?autoplay=1&controls=0&modestbranding=1&rel=0&iv_load_policy=3&fs=0&disablekb=1&hl=ru&cc_lang_pref=ru&vq=hd1080"
            allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
            allowfullscreen>
        </iframe>

        <!-- КНОПКА ДИНАМИКА -->
        <div class="sound-overlay" id="soundOverlay">
            <div class="sound-btn" id="soundBtn">
                <span class="icon">🔊</span>
                <span class="text">
                    Нажмите для звука
                    <small>Нажмите в любое место, чтобы включить звук</small>
                </span>
            </div>
        </div>
    </div>

    <!-- ===== ПАНЕЛЬ УПРАВЛЕНИЯ КАЧЕСТВОМ ===== -->
    <div class="controls-bar">
        <div class="quality-selector">
            <label>📺 Качество:</label>
            <select id="qualitySelect">
                <option value="hd1080">1080p</option>
                <option value="hd720">720p</option>
                <option value="hd480">480p</option>
                <option value="hd360">360p</option>
                <option value="hd240">240p</option>
                <option value="hd144">144p</option>
            </select>
        </div>
        <button class="btn-small" onclick="applyQuality()">Применить</button>
        <button class="btn-small" onclick="document.querySelector('iframe').requestFullscreen()">⛶ На весь экран</button>
    </div>

    <div class="actions">
        <button class="btn btn-primary" onclick="alert('🔗 Ссылка скопирована!')">
            📋 Поделиться
        </button>
        <button class="btn" id="copyLinkBtn">
            🔗 Копировать ссылку
        </button>
    </div>

    <footer class="footer">
        © 2026 Bomba TV
    </footer>
</div>

<script>
    // Копирование ссылки
    document.getElementById('copyLinkBtn').addEventListener('click', function() {
        const url = window.location.href;
        navigator.clipboard.writeText(url).then(() => {
            alert('✅ Ссылка скопирована: ' + url);
        }).catch(() => {
            const input = document.createElement('input');
            input.value = url;
            document.body.appendChild(input);
            input.select();
            document.execCommand('copy');
            document.body.removeChild(input);
            alert('✅ Ссылка скопирована: ' + url);
        });
    });

    // ===== КНОПКА ДИНАМИКА =====
    const overlay = document.getElementById('soundOverlay');
    const iframe = document.getElementById('youtubePlayer');

    function enableSound() {
        overlay.classList.add('hidden');
        const currentSrc = iframe.src;
        let newSrc = currentSrc.replace('&mute=1', '').replace('?mute=1', '?');
        if (newSrc === currentSrc) {
            newSrc = currentSrc + '&mute=0';
        }
        iframe.src = newSrc;
    }

    overlay.addEventListener('click', enableSound);
    document.getElementById('soundBtn').addEventListener('click', function(e) {
        e.stopPropagation();
        enableSound();
    });

    document.addEventListener('click', function(e) {
        if (!overlay.classList.contains('hidden') && !overlay.contains(e.target)) {
            enableSound();
        }
    });

    // ===== ПЕРЕКЛЮЧЕНИЕ КАЧЕСТВА =====
    const videoID = 'Cp7rTJT0nR8';

    function applyQuality() {
        const quality = document.getElementById('qualitySelect').value;
        // Сохраняем текущее состояние звука
        const currentSrc = iframe.src;
        const hasMute = currentSrc.includes('mute=1');
        const hasAutoplay = currentSrc.includes('autoplay=1');
        
        // Собираем новую ссылку
        let newSrc = `https://www.youtube.com/embed/${videoID}?`;
        newSrc += `autoplay=1&`;
        newSrc += `controls=0&`;
        newSrc += `modestbranding=1&`;
        newSrc += `rel=0&`;
        newSrc += `iv_load_policy=3&`;
        newSrc += `fs=0&`;
        newSrc += `disablekb=1&`;
        newSrc += `hl=ru&`;
        newSrc += `cc_lang_pref=ru&`;
        newSrc += `vq=${quality}`;
        
        if (hasMute) {
            newSrc += `&mute=1`;
        }
        
        iframe.src = newSrc;
        
        // Показываем уведомление
        const qualityNames = {
            'hd1080': '1080p',
            'hd720': '720p',
            'hd480': '480p',
            'hd360': '360p',
            'hd240': '240p',
            'hd144': '144p'
        };
        showToast(`Качество изменено на ${qualityNames[quality]}`);
    }

    // ===== TOAST-УВЕДОМЛЕНИЕ =====
    function showToast(message) {
        const existing = document.querySelector('.toast');
        if (existing) existing.remove();
        
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.textContent = message;
        Object.assign(toast.style, {
            position: 'fixed',
            bottom: '30px',
            left: '50%',
            transform: 'translateX(-50%)',
            background: 'rgba(20, 20, 30, 0.9)',
            backdropFilter: 'blur(10px)',
            color: '#fff',
            padding: '12px 28px',
            borderRadius: '50px',
            fontSize: '15px',
            fontWeight: '600',
            border: '1px solid rgba(255, 255, 255, 0.1)',
            boxShadow: '0 10px 40px rgba(0,0,0,0.5)',
            zIndex: '9999',
            transition: 'opacity 0.3s ease',
            opacity: '1'
        });
        document.body.appendChild(toast);
        
        setTimeout(() => {
            toast.style.opacity = '0';
            setTimeout(() => toast.remove(), 300);
        }, 2000);
    }

    // Подсказка при загрузке
    console.log('📺 Bomba TV загружен! Используй выпадающий список для смены качества.');
</script>

</body>
</html>
